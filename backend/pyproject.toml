[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartroute-ai-backend"
version = "0.1.0"
description = "SmartRoute — porównanie środków transportu (czas, koszt, CO2) i rekomendacje"
# Tested on 3.12 (Windows, Docker) and on 3.13 / 3.14 (Linux, pinned dependencies). The upper
# bound covers only verified versions; raise it after running the test suite on a newer one.
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.7,<3.0",
    # Baza stref czasowych dla zoneinfo (Windows nie ma systemowej): Europe/Warsaw dla GTFS.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
