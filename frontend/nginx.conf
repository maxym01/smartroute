# Template processed by the nginx image entrypoint (envsubst): ${BACKEND_UPSTREAM}.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; a variable in proxy_pass makes nginx resolve the backend
    # per request, so nginx starts even when the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://${BACKEND_UPSTREAM};

    # API -> FastAPI (same origin for the browser, CORS not needed).
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: unknown paths fall back to index.html (never cached).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
